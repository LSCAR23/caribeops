name: caribeops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caribeops}
      POSTGRES_USER: ${POSTGRES_USER:-caribeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caribeops_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  backend:

volumes:
  postgres_data:
