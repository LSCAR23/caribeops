name: caribeops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caribeops}
      POSTGRES_USER: ${POSTGRES_USER:-caribeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caribeops_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  laravel:
    build:
      context: ./backend/laravel
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-caribeops}
      DB_USERNAME: ${POSTGRES_USER:-caribeops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-caribeops_local}
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  next:
    build:
      context: ./frontend/next
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Server-side fetches run inside this container: reach Laravel over the
      # Compose backend network, not host loopback (D3-10 diagnosis).
      NEXT_PUBLIC_API_URL: http://laravel:8000
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend

  analytics:
    build:
      context: ./analytics/go
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-caribeops}:${POSTGRES_PASSWORD:-caribeops_local}@postgres:5432/${POSTGRES_DB:-caribeops}?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_data:
